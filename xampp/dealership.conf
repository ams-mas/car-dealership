# Dealership local development. Loopback access only.
Listen 127.0.0.1:8080
<VirtualHost 127.0.0.1:8080>
    ServerName localhost
    Alias /car-dealership "C:/Users/mdasi/Documents/ChatGPT/car dealership"
    <Directory "C:/Users/mdasi/Documents/ChatGPT/car dealership">
        AllowOverride All
        Require local
        Options -Indexes +FollowSymLinks
    </Directory>
    DocumentRoot "C:/Users/mdasi/Documents/ChatGPT/car dealership/public"
    <Directory "C:/Users/mdasi/Documents/ChatGPT/car dealership/public">
        AllowOverride All
        Require local
        Options -Indexes +FollowSymLinks
    </Directory>
    ErrorLog "logs/dealership-error.log"
    CustomLog "logs/dealership-access.log" combined
</VirtualHost>


